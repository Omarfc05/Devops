apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend
          image: 417651015767.dkr.ecr.us-east-1.amazonaws.com/proyecto-frontend:eks-v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: tienda
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        server {
            listen 80;

            # Frontend
            location / {
                proxy_pass http://frontend-service:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            # Backend Ventas
            location /api/v1/ventas {
                rewrite ^/api/v1/ventas(.*) /api/v1/ventas$1 break;
                proxy_pass http://ventas-service:8080;  # <-- DE VUELTA A 8080
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Backend Despachos
            location /api/v1/despachos {
                # Esta línea limpia cualquier enredo y le pasa el path exacto a Java
                rewrite ^/api/v1/despachos(.*) /api/v1/despachos$1 break;
                proxy_pass http://despachos-service:8081;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reverse-proxy
  template:
    metadata:
      labels:
        app: reverse-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config