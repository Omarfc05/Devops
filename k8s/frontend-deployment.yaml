apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend
          image: 417651015767.dkr.ecr.us-east-1.amazonaws.com/proyecto-frontend:eks-v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: tienda
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
        server {
            listen 80;
            location / { proxy_pass http://frontend-service:80; }
            location /api/v1/ventas { proxy_pass http://ventas-service:8080/api/v1/ventas; }
            location /api/v1/despachos { proxy_pass http://despachos-service:8081/api/v1/despachos; }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reverse-proxy
  template:
    metadata:
      labels:
        app: reverse-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config