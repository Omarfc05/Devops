apiVersion: v1
kind: Service
metadata:
  name: ventas-service
  namespace: tienda
spec:
  selector:
    app: ventas-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: despachos-service
  namespace: tienda
spec:
  selector:
    app: despachos-app
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081