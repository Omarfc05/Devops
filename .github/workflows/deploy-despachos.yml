name: Deploy Backend Despachos

on:
  push:
    branches: [ deploy ]
    paths:
      - 'back-Despachos_SpringBoot/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: omarffduoc/despachos-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}           # ¡Cambiado a la IP Pública!
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          script: |
            cd /home/ec2-user
            sudo rm -rf devops
            git clone https://github.com/omarfc05/devops.git
            cd /home/ec2-user/devops
            
            
            sudo docker-compose stop despachos-backend
            sudo docker-compose rm -f despachos-backend
            sudo docker-compose pull despachos-backend
            sudo -E docker-compose up -d --no-deps despachos-backend