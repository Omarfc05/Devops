name: Deploy Frontend

on:
  push:
    branches:
      - deploy # O la rama que uses (main, master, etc.)
    paths:
      - 'front_despacho/**'
      - 'docker-compose.yml'
      - 'nginx.conf'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          push: true
          tags: omarffduoc/frontend:latest # Asegúrate de que este sea tu repo en Docker Hub

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          script: |
            cd /home/ec2-user/devops
            
            # 1. Asegurar tener el último docker-compose y nginx.conf
            git pull origin deploy
            
            # 2. Descargar la nueva imagen que se acaba de subir a Docker Hub
            sudo docker-compose pull frontend
            
            # 3. Reiniciar solo el contenedor del frontend y Nginx (sin tocar backends)
            sudo docker-compose up -d --no-deps frontend
            sudo docker-compose restart reverse-proxy