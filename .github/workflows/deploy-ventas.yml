name: Deploy Backend Ventas to EKS

on:
  push:
    branches:
      - deploy
    paths:
      - 'back-Ventas_SpringBoot/**'
      - 'k8s/backend-deployment.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Ventas Image to ECR
        run: |
          docker build -t 417651015767.dkr.ecr.us-east-1.amazonaws.com/proyecto-ventas:eks-v1 ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push 417651015767.dkr.ecr.us-east-1.amazonaws.com/proyecto-ventas:eks-v1

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name eva3-eks --region us-east-1

      - name: Deploy and Restart Ventas on EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl rollout restart deployment/ventas-app -n tienda