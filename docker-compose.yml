version: '3.8'

services:
  reverse-proxy:
    image: nginx:latest
    container_name: reverse-proxy
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - app-network

  frontend:
    image: omarffduoc/frontend:latest
    container_name: frontend-app
    restart: always
    networks:
      - app-network

  ventas-backend:
    image: omarffduoc/ventas-backend:latest
    container_name: ventas-app
    environment:
      - DB_ENDPOINT=10.0.3.150
      - DB_PORT=3306
      - DB_NAME=proyecto_db
      - DB_USERNAME=root
      - DB_PASSWORD=adminpassword123
    restart: always
    networks:
      - app-network

  despachos-backend:
    image: omarffduoc/despachos-backend:latest
    container_name: despachos-app
    environment:
      - DB_ENDPOINT=10.0.3.150
      - DB_PORT=3306
      - DB_NAME=proyecto_db
      - DB_USERNAME=root
      - DB_PASSWORD=adminpassword123
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge